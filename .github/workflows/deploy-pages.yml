name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build static app
        run: bunx vite build
        env:
          # Use "/" instead if you serve from a custom domain or <user>.github.io repo.
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Prepare Pages output
        id: out
        run: |
          # Build output lands in dist/client or .output/public depending on environment.
          SHELL_FILE=$(find dist/client .output/public -maxdepth 1 -name '_shell.html' 2>/dev/null | head -n1)
          if [ -z "$SHELL_FILE" ]; then echo "_shell.html not found"; ls -R dist .output 2>/dev/null | head -50; exit 1; fi
          OUT_DIR=$(dirname "$SHELL_FILE")
          echo "dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          cd "$OUT_DIR"
          cp _shell.html index.html
          cp _shell.html 404.html
          rm -f _headers
          touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
